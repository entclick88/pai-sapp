<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ร้านล้างรถ | จองคิว</title><link rel="stylesheet" href="style.css"></head><body data-page="customer"><header><div><h1 class="shop-name">ร้านล้างรถ</h1><div class="sub">สะอาดทุกมุม • เช็กคิวได้จากมือถือ</div></div><span>จองบริการออนไลน์</span></header><main><div id="message" role="alert"></div><section id="tracking" hidden></section><section><h2>รับบริการล้างรถ</h2><p class="muted">เลือกรายการบริการและกรอกข้อมูลรถ เพื่อเข้าคิวกับทางร้าน</p><form id="booking"><div class="grid"><label><span>ชื่อผู้รับบริการ</span><input name="name" autocomplete="name" maxlength="100" required></label><label><span>ทะเบียนรถ (รวมจังหวัดถ้าต้องการ)</span><input name="plate" placeholder="เช่น กข 1234 กรุงเทพฯ" maxlength="30" required></label><label><span>ประเภทรถ</span><select name="vehicle"><option>รถเก๋ง</option><option>SUV / PPV</option><option>รถกระบะ</option><option>รถตู้</option><option>มอเตอร์ไซค์</option></select></label></div><h2>เลือกบริการ</h2><div id="services" class="services">กำลังโหลดบริการ…</div><div class="total row"><span>ยอดรวม</span><strong class="price" id="total">฿0</strong></div><button type="submit">ยืนยันรับคิว</button></form></section><section><h2>คิวของฉัน</h2><p class="muted">จำคิวในเบราว์เซอร์เครื่องนี้ แตะเพื่อเปิดสถานะและชำระเงิน</p><div id="history"></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="app.js"></script></body></html>
