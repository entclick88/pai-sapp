<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ร้านล้างรถ | พนักงาน</title><link rel="stylesheet" href="style.css"></head><body data-page="admin"><header><div><h1 class="shop-name">ร้านล้างรถ</h1><div class="sub">รับรถ • ดูแลคิว • ส่งมอบรถ</div></div><nav><a href="index.html">หน้าลูกค้า</a><a href="owner.html">เจ้าของร้าน</a></nav></header><main><div id="message" role="alert"></div><section id="login"><h2>เข้าสู่ระบบพนักงาน</h2><form id="login-form"><label><span>รหัสพนักงาน</span><input name="pin" type="password" required autocomplete="current-password"></label><button>เข้าสู่ระบบ</button></form></section><div id="workspace" hidden><section><div class="row"><h2>คิวบริการ</h2><div class="actions"><button id="sound" class="secondary">เปิดเสียงแจ้งเตือน</button><button id="logout" class="secondary">ออกจากระบบ</button></div></div><div id="jobs" class="jobs"></div></section><section><h2>รับรถหน้าร้าน</h2><form id="booking"><div class="grid"><label><span>ชื่อลูกค้า</span><input name="name" required maxlength="100"></label><label><span>ทะเบียนรถ</span><input name="plate" required maxlength="30"></label><label><span>ประเภทรถ</span><select name="vehicle"><option>รถเก๋ง</option><option>SUV / PPV</option><option>รถกระบะ</option><option>รถตู้</option><option>มอเตอร์ไซค์</option></select></label></div><div id="services" class="services"></div><div class="total row"><span>ยอดรวม</span><strong id="total" class="price">฿0</strong></div><button>รับคิวเข้าระบบ</button></form></section><section><h2>บริการและราคา</h2><div id="service-management"></div><form id="service-form"><div class="grid"><label><span>ชื่อบริการใหม่</span><input name="name" required></label><label><span>ราคา (บาท)</span><input name="price" type="number" min="0" step="0.01" required></label><label><span>ระยะเวลาโดยประมาณ (นาที)</span><input name="minutes" type="number" min="1" value="30" required></label></div><button>เพิ่มบริการ</button></form></section><section><h2>ตั้งค่าร้าน</h2><form id="settings-form"><label><span>ชื่อร้าน</span><input name="shopName" required></label><label><span>เลขพร้อมเพย์ของร้าน</span><input name="promptpayId" inputmode="numeric" placeholder="เบอร์ 10 หลัก หรือเลขประจำตัว 13 หลัก"></label><button>บันทึก</button></form><p class="muted">QR รับบริการใช้ลิงก์เดียวกัน ลูกค้าแต่ละเครื่องติดตามคิวของตัวเองได้</p><div id="qr"></div><a id="booking-link"></a></section></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="app.js"></script></body></html>
