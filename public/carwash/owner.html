<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ร้านล้างรถ | เจ้าของร้าน</title><link rel="stylesheet" href="style.css"></head><body data-page="owner"><header><div><h1 class="shop-name">ร้านล้างรถ</h1><div class="sub">ภาพรวมยอดขายและรายจ่าย</div></div><nav><a href="admin.html">หน้าพนักงาน</a><a href="index.html">หน้าลูกค้า</a></nav></header><main><div id="message" role="alert"></div><section id="login"><h2>เข้าสู่ระบบเจ้าของร้าน</h2><form id="login-form"><label><span>รหัสพนักงาน / เจ้าของร้าน</span><input name="pin" type="password" required autocomplete="current-password"></label><button>เข้าสู่ระบบ</button></form></section><div id="workspace" hidden><section><div class="row"><h2>ผลประกอบการ</h2><button id="logout" class="secondary">ออกจากระบบ</button></div><form id="range-form"><div class="grid"><label><span>ตั้งแต่</span><input name="from" type="date" required></label><label><span>ถึง</span><input name="to" type="date" required></label></div><button>ดูรายงาน</button></form><div class="metrics" id="metrics"></div><p class="muted">ยอดขายนับวันที่รับชำระตามเวลาไทย ส่วนต่างแสดงยอดรับชำระลบรายจ่ายที่บันทึก ไม่ใช่กำไรทางบัญชีที่ปรับสต็อกหรือค่าเสื่อมแล้ว</p></section><section><h2>บันทึกรายจ่าย</h2><form id="expense-form"><div class="grid"><label><span>วันที่</span><input name="day" type="date" required></label><label><span>รายการ</span><input name="description" placeholder="น้ำยา ค่าแรง ค่าน้ำ ค่าไฟ" required></label><label><span>จำนวนเงิน (บาท)</span><input name="amount" type="number" min="0.01" step="0.01" required></label></div><button>บันทึกรายจ่าย</button></form><div id="expenses"></div></section></div></main><script src="app.js"></script></body></html>
