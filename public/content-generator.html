<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 1000px;
      width: 100%;
      padding: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      color: #333;
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 1.1em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 1em;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 1em;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      background-color: #f8f9ff;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    button {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-generate {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      flex: 2;
    }

    .btn-generate:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-generate:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-clear {
      background: #f0f0f0;
      color: #333;
    }

    .btn-clear:hover {
      background: #e0e0e0;
    }

    .output-section {
      margin-top: 30px;
      display: none;
    }

    .output-section.active {
      display: block;
      animation: slideIn 0.3s ease-in;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 15px;
    }

    .output-header h2 {
      color: #333;
      font-size: 1.5em;
    }

    .btn-copy {
      background: #4CAF50;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9em;
      transition: all 0.3s;
    }

    .btn-copy:hover {
      background: #45a049;
      transform: translateY(-2px);
    }

    .output-content {
      background: #f8f9ff;
      padding: 20px;
      border-radius: 8px;
      line-height: 1.8;
      color: #333;
      max-height: 500px;
      overflow-y: auto;
    }

    .output-content p {
      margin-bottom: 15px;
    }

    .output-stats {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
      font-size: 0.9em;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 40px;
      display: none;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      border: 4px solid #f0f0f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid #c62828;
      display: none;
    }

    .error-message.active {
      display: block;
      animation: slideIn 0.3s ease-in;
    }

    .success-message {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid #2e7d32;
      display: none;
    }

    .success-message.active {
      display: block;
      animation: slideIn 0.3s ease-in;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✨ AI Content Generator</h1>
      <p>Generate engaging stories, ideas, and content with AI</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="generatorForm">
      <div class="form-group">
        <label for="topic">📝 Topic / Idea</label>
        <input
          type="text"
          id="topic"
          placeholder="e.g., How robots can help in education, The future of space travel, etc."
          required
        >
      </div>

      <div class="options-grid">
        <div class="form-group">
          <label for="style">🎨 Writing Style</label>
          <select id="style">
            <option value="informative">Informative</option>
            <option value="creative">Creative & Imaginative</option>
            <option value="philosophical">Philosophical & Thoughtful</option>
            <option value="playful">Playful & Fun</option>
            <option value="academic">Academic</option>
          </select>
        </div>

        <div class="form-group">
          <label for="type">📚 Content Type</label>
          <select id="type">
            <option value="story">Story</option>
            <option value="essay">Essay</option>
            <option value="blog post">Blog Post</option>
            <option value="explanation">Explanation</option>
            <option value="philosophy">Philosophy</option>
            <option value="dialogue">Dialogue</option>
          </select>
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-generate" id="generateBtn">
          ⚡ Generate Content
        </button>
        <button type="button" class="btn-clear" id="clearBtn">
          🔄 Clear
        </button>
      </div>
    </form>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Generating your content with AI...</p>
    </div>

    <div class="output-section" id="outputSection">
      <div class="output-header">
        <h2>📄 Generated Content</h2>
        <button type="button" class="btn-copy" id="copyBtn">📋 Copy to Clipboard</button>
      </div>

      <div class="output-content" id="outputContent"></div>

      <div class="output-stats">
        <span>📊 Input Tokens: <strong id="inputTokens">0</strong></span>
        <span>📈 Output Tokens: <strong id="outputTokens">0</strong></span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('generatorForm');
    const topic = document.getElementById('topic');
    const style = document.getElementById('style');
    const type = document.getElementById('type');
    const generateBtn = document.getElementById('generateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const loading = document.getElementById('loading');
    const outputSection = document.getElementById('outputSection');
    const outputContent = document.getElementById('outputContent');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const copyBtn = document.getElementById('copyBtn');

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('active');
      setTimeout(() => errorMessage.classList.remove('active'), 5000);
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('active');
      setTimeout(() => successMessage.classList.remove('active'), 3000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!topic.value.trim()) {
        showError('Please enter a topic');
        return;
      }

      generateBtn.disabled = true;
      loading.classList.add('active');
      outputSection.classList.remove('active');
      errorMessage.classList.remove('active');

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            topic: topic.value,
            style: style.value,
            type: type.value
          })
        });

        const data = await response.json();

        loading.classList.remove('active');

        if (data.success) {
          outputContent.innerHTML = data.content
            .split('\n\n')
            .map(para => `<p>${para.trim()}</p>`)
            .join('');

          document.getElementById('inputTokens').textContent = data.usage?.input_tokens || 0;
          document.getElementById('outputTokens').textContent = data.usage?.output_tokens || 0;

          outputSection.classList.add('active');
          showSuccess('Content generated successfully! 🎉');
        } else {
          showError(data.error || 'Failed to generate content');
        }
      } catch (error) {
        loading.classList.remove('active');
        showError('Error: ' + error.message);
      } finally {
        generateBtn.disabled = false;
      }
    });

    clearBtn.addEventListener('click', () => {
      form.reset();
      outputSection.classList.remove('active');
      errorMessage.classList.remove('active');
      topic.focus();
    });

    copyBtn.addEventListener('click', () => {
      const text = outputContent.innerText;
      navigator.clipboard.writeText(text).then(() => {
        showSuccess('Content copied to clipboard! ✅');
      }).catch(() => {
        showError('Failed to copy content');
      });
    });

    topic.focus();
  </script>
</body>
</html>
