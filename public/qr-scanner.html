<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ปายแซ่บ - สแกน QR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #d32f2f 0%, #ff6f00 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 100%;
    }

    .header {
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
      font-style: italic;
      margin-bottom: 15px;
    }

    .scanner-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    #video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      background: #000;
    }

    #canvas {
      display: none;
    }

    .scanner-status {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
    }

    .scanner-status.detecting {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .scanner-status.detected {
      background: #c8e6c9;
      color: #1b5e20;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .instructions {
      color: white;
      margin-top: 30px;
      font-size: 14px;
      line-height: 1.6;
    }

    .manual-input {
      margin-top: 20px;
      text-align: center;
    }

    .manual-input input {
      width: 100%;
      max-width: 300px;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .manual-input button {
      background: #d32f2f;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .manual-input button:hover {
      background: #b71c1c;
    }

    .loading {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #2e7d32;
      border-radius: 50%;
      animation: pulse 0.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .scanner-box {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌶️ ปายแซ่บ</h1>
      <p>คิดถึงความแซ่บ นัว คิดถึงเรา</p>
    </div>

    <div class="scanner-box">
      <video id="video" playsinline></video>
      <canvas id="canvas"></canvas>

      <div class="scanner-status" id="status">
        <span class="loading"></span> กำลังเปิดกล้อง...
      </div>

      <div class="error" id="error" style="display: none;"></div>

      <div class="manual-input">
        <p style="font-size: 12px; color: #999; margin-bottom: 10px;">ไม่มีกล้อง?</p>
        <input type="text" id="qrInput" placeholder="ใส่รหัส QR ได้ที่นี่" />
        <button onclick="goToOrder()">เข้าเมนู</button>
      </div>
    </div>

    <div class="instructions">
      <p>📱 ชี้กล้องไปที่ QR code บนโต๊ะ</p>
      <p>ระบบจะตรวจจับโดยอัตโนมัติ</p>
    </div>
  </div>

  <script>
    let isProcessing = false;

    async function startScanner() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const status = document.getElementById('status');
      const error = document.getElementById('error');

      try {
        // Request camera access
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });

        video.srcObject = stream;

        status.textContent = 'ค้นหา QR Code...';
        status.classList.add('detecting');

        // Start scanning
        function scan() {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: 'dontInvert'
            });

            if (code && !isProcessing) {
              isProcessing = true;
              handleQRDetected(code.data);
              return;
            }
          }
          requestAnimationFrame(scan);
        }

        video.onloadedmetadata = () => {
          video.play();
          scan();
        };
      } catch (err) {
        error.style.display = 'block';
        error.innerHTML = `<strong>❌ ไม่สามารถเข้าถึงกล้อง</strong><br>กรุณาอนุญาตให้ใช้กล้อง หรือใช้วิธีกรอกรหัส`;
        status.textContent = 'ไม่สามารถเปิดกล้องได้';
        status.classList.remove('detecting');
      }
    }

    function handleQRDetected(qrData) {
      const status = document.getElementById('status');
      status.classList.remove('detecting');
      status.classList.add('detected');
      status.innerHTML = '<span class="loading"></span> พบ QR Code! กำลังไปหน้าเมนู...';

      // Assume QR data is the QR code value
      setTimeout(() => {
        window.location.href = `/order.html?qr=${encodeURIComponent(qrData)}`;
      }, 500);
    }

    function goToOrder() {
      const qrInput = document.getElementById('qrInput').value.trim();
      if (!qrInput) {
        alert('กรุณาใส่รหัส QR');
        return;
      }
      window.location.href = `/order.html?qr=${encodeURIComponent(qrInput)}`;
    }

    // Allow Enter key to submit
    document.getElementById('qrInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        goToOrder();
      }
    });

    // Start scanner on load
    startScanner();
  </script>
</body>
</html>
